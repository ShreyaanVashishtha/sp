<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Audio Jam Room</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl">
    <div class="flex items-center gap-3 mb-6">
      <div id="status-indicator" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></div>
      <h1 class="text-xl font-bold tracking-tight">Audio Broadcast Room</h1>
    </div>

    <!-- ROOM INFO -->
    <div class="bg-zinc-950/70 p-4 rounded-xl border border-zinc-800 mb-6">
      <p class="text-xs text-zinc-400 uppercase font-semibold">Share Room Link</p>
      <div class="flex items-center gap-2 mt-2">
        <input id="room-link" type="text" readonly class="bg-zinc-900 text-sm text-zinc-300 w-full p-2.5 rounded-lg border border-zinc-700 outline-none select-all" />
        <button id="copy-btn" class="bg-zinc-800 hover:bg-zinc-700 text-xs px-3 py-2.5 rounded-lg font-medium transition">Copy</button>
      </div>
    </div>

    <!-- HOST CONTROLS -->
    <div id="host-panel" class="hidden space-y-4">
      <div class="p-4 bg-emerald-950/30 border border-emerald-800/40 rounded-xl text-sm text-emerald-300">
        👑 <b>Host:</b> Click below. Select the Spotify tab/window and ensure <b>"Also share audio"</b> is checked!
      </div>
      <button id="start-broadcast-btn" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded-xl shadow-lg transition">
        🎵 Start Spotify Audio Broadcast
      </button>
      <p id="listener-count" class="text-center text-xs text-zinc-500">Connected listeners: 0</p>
    </div>

    <!-- LISTENER CONTROLS -->
    <div id="listener-panel" class="hidden space-y-4">
      <div class="p-4 bg-blue-950/30 border border-blue-800/40 rounded-xl text-sm text-blue-300">
        🎧 <b>Listener:</b> You don't need Spotify. Tap the button below to enable sound.
      </div>
      <button id="listen-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition">
        🔊 Tap to Enable Audio
      </button>
      <div id="status" class="text-center text-sm text-zinc-400">
        Connecting to host...
      </div>
      <audio id="remote-audio" autoplay playsinline></audio>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const joinRoomId = urlParams.get('room');
    const isHost = !joinRoomId;

    const hostPanel = document.getElementById('host-panel');
    const listenerPanel = document.getElementById('listener-panel');
    const roomLinkInput = document.getElementById('room-link');
    const copyBtn = document.getElementById('copy-btn');
    const remoteAudio = document.getElementById('remote-audio');
    const statusText = document.getElementById('status');
    const listenerCountText = document.getElementById('listener-count');
    const statusIndicator = document.getElementById('status-indicator');

    let localAudioStream = null;
    let waitingPeerIds = new Set();
    let activeCalls = [];

    // PeerJS with Google STUN servers to bypass mobile cellular NAT/firewalls
    const peer = new Peer({
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    });

    peer.on('open', (id) => {
      statusIndicator.classList.remove('bg-amber-500');
      statusIndicator.classList.add('bg-emerald-500');

      if (isHost) {
        const roomUrl = `${window.location.origin}${window.location.pathname}?room=${id}`;
        roomLinkInput.value = roomUrl;
        hostPanel.classList.remove('hidden');
        setupHostSignaling();
      } else {
        hostPanel.classList.add('hidden');
        listenerPanel.classList.remove('hidden');
        roomLinkInput.value = window.location.href;
        setupListener(joinRoomId);
      }
    });

    peer.on('error', (err) => {
      console.error('Peer error:', err);
      if (statusText) statusText.textContent = 'Connection error: ' + err.type;
    });

    // --- HOST LOGIC ---
    function setupHostSignaling() {
      // Listen for data ping from listeners who join early
      peer.on('connection', (conn) => {
        conn.on('open', () => {
          waitingPeerIds.add(conn.peer);
          updateListenerCount();

          // If audio is already active, call the newcomer immediately
          if (localAudioStream) {
            callListener(conn.peer);
          }
        });

        conn.on('close', () => {
          waitingPeerIds.delete(conn.peer);
          updateListenerCount();
        });
      });

      // Handle direct calls if listener dials in
      peer.on('call', (call) => {
        if (localAudioStream) {
          call.answer(localAudioStream);
          trackCall(call);
        }
      });

      document.getElementById('start-broadcast-btn').addEventListener('click', async () => {
        try {
          const displayStream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });

          const audioTrack = displayStream.getAudioTracks()[0];
          if (!audioTrack) {
            alert('⚠️ No audio captured! You must check the "Share audio" / "Also share tab audio" box.');
            displayStream.getTracks().forEach(t => t.stop());
            return;
          }

          // Discard video track to save bandwidth
          displayStream.getVideoTracks().forEach(t => t.stop());
          localAudioStream = new MediaStream([audioTrack]);

          document.getElementById('start-broadcast-btn').textContent = "🟢 Broadcasting Spotify Audio";
          document.getElementById('start-broadcast-btn').disabled = true;

          // Call every waiting listener
          waitingPeerIds.forEach((listenerId) => {
            callListener(listenerId);
          });

        } catch (err) {
          console.error(err);
          alert('Could not capture audio: ' + err.message);
        }
      });
    }

    function callListener(peerId) {
      if (!localAudioStream) return;
      const call = peer.call(peerId, localAudioStream);
      trackCall(call);
    }

    function trackCall(call) {
      activeCalls.push(call);
      updateListenerCount();
      call.on('close', () => {
        activeCalls = activeCalls.filter(c => c !== call);
        updateListenerCount();
      });
    }

    function updateListenerCount() {
      const total = Math.max(waitingPeerIds.size, activeCalls.length);
      listenerCountText.textContent = `Connected listeners: ${total}`;
    }

    // --- LISTENER LOGIC ---
    function setupListener(hostId) {
      statusText.textContent = "Connecting to host...";

      // 1. Establish a data channel to notify host we are here
      const conn = peer.connect(hostId, { reliable: true });

      conn.on('open', () => {
        statusText.textContent = "Host found! Waiting for host to share audio...";
      });

      // 2. Answer when the host sends the audio stream
      peer.on('call', (call) => {
        call.answer(); // Listener answers without sending an audio stream back

        call.on('stream', (stream) => {
          remoteAudio.srcObject = stream;
          statusText.textContent = "🟢 Receiving live audio!";
          statusText.classList.add('text-emerald-400');
          // Try playing automatically
          remoteAudio.play().catch(() => {
            statusText.textContent = "🔊 Audio ready! Tap the blue button to play.";
          });
        });
      });

      // 3. User interaction to bypass mobile browser audio lock
      const listenBtn = document.getElementById('listen-btn');
      listenBtn.addEventListener('click', () => {
        remoteAudio.play().then(() => {
          listenBtn.textContent = "🔊 Audio Playing";
          listenBtn.classList.replace('bg-indigo-600', 'bg-zinc-700');
        }).catch((e) => {
          console.error('Play blocked:', e);
        });
      });
    }

    // Copy room link
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(roomLinkInput.value);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = 'Copy', 2000);
    });
  </script>
</body>
</html>
